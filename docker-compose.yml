services:
  db:
    image: postgres:15-alpine
    container_name: pg_database_english
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: fastapi_api_english
    restart: always
    depends_on:
      db:
        condition: service_healthy # Só sobe a API quando o DB passar no teste acima
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
    # O comando abaixo aplica migrations ANTES de subir a API
    command: >
      sh -c "alembic upgrade head && 
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build: ./frontend
    container_name: react_frontend_english
    restart: always
    depends_on:
      api:
        condition: service_started
    ports:
      - "5200:5200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - WDS_SOCKET_PORT=0

volumes:
  pgdata:
