[project]
name = "learnwatching-api"
version = "1.0.0"
description = "Backend do LearnWatching: lista as legendas disponíveis de vídeos do YouTube."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "uvicorn[standard]>=0.32",
    "structlog>=24.4",
    "yt-dlp>=2025.1.1",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S", "PTH"]
ignore = [
    "S101",   # assert é usado nos testes
    "B008",   # Depends() em parâmetros padrão é o idioma do FastAPI
    "RUF001", # textos em português usam caracteres "ambíguos"
    "RUF002",
    "RUF003",
    "N818",   # exceções de domínio têm nomes de regra (EmailTaken), sem sufixo Error
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
