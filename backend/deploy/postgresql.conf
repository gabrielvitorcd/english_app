# Postgres do LearnWatching na VPS (4 vCPU / 8 GB), que divide a máquina com o core-studio (Postgres com
# shared_buffers de 1 GB, API e worker). Por isso é enxuto: uma API com 2 workers e no máximo 20 conexões
# no pool (10 por worker: pool_size 5 + max_overflow 5, em app/core/db.py), sem worker de jobs. Os valores seguem as proporções do core (1/4 da
# memória reservada para shared_buffers, effective_cache_size em 3×) numa fatia de cerca de 1 GB.
listen_addresses = '*'
max_connections = 30                  # 20 do pool da API + folga para pg_dump, migrations e psql à mão
shared_buffers = 256MB
effective_cache_size = 768MB          # só uma estimativa para o planejador (3× shared_buffers)
work_mem = 8MB                        # por operação de ordenação/hash; 30 conexões não estouram a memória
maintenance_work_mem = 64MB           # VACUUM, CREATE INDEX, restore
wal_buffers = 8MB                     # 1/32 de shared_buffers (o que o Postgres escolheria sozinho)
checkpoint_completion_target = 0.9
random_page_cost = 1.1                # disco SSD
effective_io_concurrency = 200        # disco SSD
log_min_duration_statement = 500      # registra consultas acima de 500 ms
timezone = 'America/Sao_Paulo'
